<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prode Mundial 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--wr:#C8102E;--wgr:#00843D;--wb:#003DA5;--wg:#C5A028;--wr-tx:#FF6B7A;--wgr-tx:#5FFF8A;--wb-tx:#9EC0FF;--wg-tx:#FFE07A;--wrl:rgba(200,16,46,0.22);--wgrl:rgba(0,132,61,0.22);--wbl:rgba(0,61,165,0.28);--wgl:rgba(197,160,40,0.22);--bg:transparent;--card:rgba(15,15,15,0.88);--text:#FFFFFF;--text2:#CCCCCC;--text3:#888888;--border:rgba(255,255,255,0.15);--border2:rgba(255,255,255,0.25);--inp:rgba(255,255,255,0.08);--success-bg:rgba(0,230,118,0.18);--success-text:#5FFF8A;--warn-bg:rgba(255,210,74,0.18);--warn-text:#FFD24A;--radius:10px;--radius-sm:6px}
html{overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;background-image:linear-gradient(rgba(0,0,0,0.70),rgba(0,0,0,0.70)),url('https://statics.diariomendoza.com.ar/2022/12/crop/639f631f04c6d__780x780.webp');background-size:cover;background-position:center top;background-attachment:fixed;background-repeat:no-repeat}
.wrap{max-width:680px;margin:0 auto;padding:1rem}
.screen{display:none}.screen.active{display:block}
.hero{background:rgba(15,15,15,0.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:2px solid var(--wg);border-radius:var(--radius);padding:2rem 1.5rem;text-align:center;margin-bottom:1.25rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--wr) 0%,var(--wr) 50%,var(--wgr) 100%)}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:6px;background:var(--wb)}
.hero i{font-size:48px;color:var(--wg)}
.hero-title{font-size:22px;font-weight:600;color:var(--text);margin-top:.5rem}
.hero-sub{font-size:13px;color:var(--text2);margin-top:4px}
.hero-flags{font-size:22px;margin-top:10px;letter-spacing:8px}
.login-card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;max-width:360px;margin:0 auto}
.login-title{font-size:15px;font-weight:600;margin-bottom:1.25rem;text-align:center;color:var(--text)}
select,input[type=text],input[type=password]{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--inp);color:var(--text);font-size:14px;font-family:inherit}
select option,select optgroup{background-color:#1a1a1a;color:#FFFFFF}
select:focus,input:focus{outline:none;border-color:var(--wb)}
.pin-row{display:flex;gap:10px;justify-content:center;margin:1rem 0}
.pin-digit{width:54px!important;height:58px;text-align:center;font-size:22px;font-weight:600;border:2px solid var(--border2);border-radius:var(--radius-sm);background:var(--inp);color:var(--text)}
.pin-digit:focus{border-color:var(--wb)}
.pin-digit.error{border-color:var(--wr);background:var(--wrl)}
.login-btn{width:100%;padding:11px;font-size:15px;font-weight:600;background:var(--wr);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;margin-top:.5rem;font-family:inherit}
.login-btn:hover{opacity:.88}
.err-msg{font-size:12px;color:var(--wr-tx);text-align:center;min-height:18px;margin-top:6px}
.link-btn{display:block;text-align:center;font-size:12px;color:var(--text3);margin-top:1rem;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px}
.link-btn:hover{color:var(--text2)}
.topbar{background:var(--wb);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.t-av{width:36px;height:36px;border-radius:50%;background:var(--wg);color:#7a5500;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.t-name{font-size:14px;font-weight:600;color:#fff}
.t-pts{font-size:11px;color:rgba(255,255,255,.65)}
.exit-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.exit-btn:hover{background:rgba(255,255,255,.25)}
.nav{display:flex;gap:2px;border-bottom:2px solid var(--wr-tx);margin-bottom:1.1rem;flex-wrap:wrap}
.nb{padding:9px 14px;font-size:13px;cursor:pointer;border:none;background:transparent;color:var(--text2);border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit;transition:all .12s}
.nb.active{color:var(--wr-tx);border-bottom-color:var(--wr-tx);font-weight:600}
.nb:hover:not(.active){color:var(--text);background:rgba(255,255,255,.06)}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:.75rem}
.card-gl{border-left:4px solid var(--wg);border-radius:0 var(--radius) var(--radius) 0}
.card-rl{border-left:4px solid var(--wr);border-radius:0 var(--radius) var(--radius) 0}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.sc{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;text-align:center}
.sv{font-size:20px;font-weight:700}.sl{font-size:11px;color:var(--text2);margin-top:2px}
.info-pill{background:var(--wbl);color:var(--wb-tx);border:1px solid rgba(0,61,165,0.35);border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;margin-bottom:.9rem}
.ph-lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--wb-tx);margin:1.2rem 0 .5rem;display:flex;align-items:center;gap:8px}
.ph-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.match-row{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.match-row.locked{opacity:.7;background:rgba(255,255,255,0.04)}
.mteams{font-size:13px;font-weight:600;color:var(--text)}
.vs{font-size:11px;color:var(--text3);margin:0 4px}
.si{width:52px!important;text-align:center;font-size:15px;font-weight:600;padding:6px 4px!important}
.ab{width:32px;height:32px;border-radius:50%;border:2px solid var(--border2);background:transparent;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;color:var(--text3);font-family:inherit;flex-shrink:0}
.ab.on{border-color:var(--wg);background:var(--wgl);color:#7a5500}
.ab:disabled{cursor:not-allowed;opacity:.35}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bg{background:var(--wgl);color:var(--wg-tx);border:1px solid rgba(197,160,40,0.35)}
.br{background:var(--wrl);color:var(--wr-tx);border:1px solid rgba(200,16,46,0.35)}
.bb{background:var(--wbl);color:var(--wb-tx);border:1px solid rgba(0,61,165,0.4)}
.bgreen{background:var(--success-bg);color:var(--success-text);border:1px solid rgba(0,230,118,0.35)}
.bgray{background:var(--inp);color:var(--text2);border:1px solid var(--border)}
.rank-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.rank-table th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--wr-tx);font-size:12px;color:var(--text2);font-weight:600}
.rank-table td{padding:10px;border-bottom:1px solid var(--border)}
.rank-table tbody tr:hover td{background:rgba(255,255,255,0.05)}
.bonus-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bl{font-size:13px;color:var(--text2);flex:0 0 160px}
.admin-bar{background:var(--wr);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.add-box{margin-top:.75rem;padding:1rem;border:1px solid var(--border);border-radius:var(--radius);background:rgba(255,255,255,0.04);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pin-show{display:flex;gap:3px;align-items:center}
.pin-dot{width:7px;height:7px;border-radius:50%;background:var(--wg)}
.btn-p{background:var(--wr);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
.btn-g{background:var(--wgr);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
.btn-g:hover{opacity:.88}
.btn-p:hover{opacity:.88}
.btn-r{background:var(--wr);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
.btn-d{background:transparent;border:1px solid rgba(255,107,122,0.5);color:var(--wr-tx);border-radius:var(--radius-sm);padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.msg{font-size:13px;color:var(--text2);text-align:center;padding:2rem 1rem}
select.adv-sel{width:auto!important;flex:1;min-width:110px;font-size:12px;padding:6px 8px!important}
.elim-step{margin-top:10px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:rgba(255,255,255,0.04)}
.elim-step-lbl{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);margin-bottom:7px}
.elim-fb{margin-top:7px;font-size:11.5px;font-weight:600;min-height:15px;color:var(--text3)}
.elim-fb.ok{color:#7BD389}
.elim-fb.warn{color:#E9C46A}
.elim-radio{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:rgba(0,0,0,0.18)}
.elim-radio input{width:15px;height:15px;cursor:pointer;accent-color:var(--wgr)}
.res-tag{display:inline-block;margin-left:5px;font-size:9px;font-weight:700;letter-spacing:.03em;padding:1px 5px;border-radius:6px;background:rgba(255,255,255,0.16);color:var(--text2);vertical-align:middle}
.gtable{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.gtable th,.gtable td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--border)}
.gtable th{font-size:10px;color:var(--text2);font-weight:600;background:rgba(255,255,255,0.06);text-transform:uppercase;letter-spacing:.04em}
.gtable th:first-child,.gtable td:first-child{text-align:left;padding-left:10px;width:34%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtable tr.qual td{background:var(--wgrl)}
.gtable tr.third td{background:rgba(255,210,74,0.10)}
.bracket-wrap{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);position:relative}
.bracket-title{font-size:14px;font-weight:700;color:var(--wr-tx);margin-bottom:1rem;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.05em;justify-content:center}
.bracket-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;align-items:stretch;padding:6px 0 14px;position:relative}
@media(min-width:760px){.bracket-grid{position:relative;width:min(1100px,calc(100vw - 32px));left:50%;transform:translateX(-50%)}}
@media(max-width:759px){.bracket-grid{grid-template-columns:repeat(9,88px);overflow-x:auto;width:100%;left:0;transform:none}}
.br-col{display:flex;flex-direction:column;min-width:0;gap:6px}
.br-col h5{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--wr-tx);text-align:center;padding:4px 2px;margin-bottom:4px;border-bottom:1px solid var(--wr);letter-spacing:.04em;line-height:1.2}
.br-col h5 .d{display:block;font-weight:500;font-size:8px;color:var(--text2);text-transform:none;letter-spacing:0;margin-top:1px}
.br-col.final-col h5{color:var(--wg-tx);border-bottom-color:var(--wg)}
.br-pairs{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:10px}
.br-pair{display:flex;flex-direction:column;gap:4px;position:relative}
.br-single{display:flex;flex:1;align-items:center;justify-content:center;position:relative}
.br-card{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:4px 5px;font-size:10px;line-height:1.3}
.br-row{display:flex;justify-content:space-between;align-items:center;gap:3px;padding:2px 0;color:var(--text2)}
.br-row.win{color:var(--wgr-tx);font-weight:700}
.br-row.lose{opacity:.45}
.br-team{flex:1;min-width:0;display:flex;align-items:center;gap:3px;overflow:hidden;white-space:nowrap}
.br-team .team-flag{font-size:11px;flex-shrink:0}
.br-team-name{overflow:hidden;text-overflow:ellipsis;font-weight:600;letter-spacing:.02em}
.br-score{font-weight:700;min-width:10px;text-align:center;font-size:10px}
.br-divider{height:1px;background:var(--border);margin:1px 0}
.br-meta{font-size:7.5px;color:var(--text3);text-align:center;margin-top:2px;letter-spacing:.02em}
.br-res{margin-left:3px;font-weight:700;color:var(--wg-tx);letter-spacing:.03em}
.br-card.final{border:2px solid var(--wg);background:linear-gradient(135deg,rgba(197,160,40,0.20) 0%,rgba(15,15,15,0.92) 100%);box-shadow:0 0 14px rgba(197,160,40,0.35);padding:6px 7px;font-size:11px}
.br-card.final .br-meta{color:var(--wg-tx);font-weight:700;font-size:8px}
.br-col.left .br-pair::before{content:'';position:absolute;left:100%;top:14%;bottom:14%;width:6px;border:1px solid var(--border);border-left:none;border-radius:0 4px 4px 0;pointer-events:none}
.br-col.left .br-pair::after{content:'';position:absolute;left:calc(100% + 5px);top:50%;width:4px;height:1px;background:var(--border)}
.br-col.right .br-pair::before{content:'';position:absolute;right:100%;top:14%;bottom:14%;width:6px;border:1px solid var(--border);border-right:none;border-radius:4px 0 0 4px;pointer-events:none}
.br-col.right .br-pair::after{content:'';position:absolute;right:calc(100% + 5px);top:50%;width:4px;height:1px;background:var(--border)}
@media(max-width:759px){.br-col.left .br-pair::before,.br-col.left .br-pair::after,.br-col.right .br-pair::before,.br-col.right .br-pair::after{display:none}}
.br-tp{margin-top:1.4rem;text-align:center}
.br-tp h4{font-size:11px;font-weight:700;color:var(--wg-tx);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px;justify-content:center}
.br-tp .br-card{max-width:220px;margin:0 auto;text-align:left}
.gtable td.pts{font-weight:700;color:var(--wr-tx)}
.gtable .team-name{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.gtable .team-flag{font-size:14px}
.gcard{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1rem}
.gcard h4{padding:8px 12px;font-size:12px;font-weight:700;background:var(--wb);color:#fff;letter-spacing:.05em}
.jornada-hdr{display:flex;align-items:center;gap:8px;margin:1.2rem 0 .5rem;padding:6px 10px;background:linear-gradient(90deg,var(--wrl) 0%,rgba(255,255,255,0.04) 100%);border-left:4px solid var(--wr);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--wr-tx)}
.jornada-hdr .j-num{background:var(--wr);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px}
.jornada-hdr.elim{background:linear-gradient(90deg,var(--wgl) 0%,rgba(255,255,255,0.04) 100%);border-left-color:var(--wg);color:var(--wg-tx)}
.jornada-hdr.elim .j-num{background:var(--wg);color:#1a1a1a}
.view-toggle{display:flex;gap:4px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:24px;padding:3px;margin-bottom:1rem}
.vt-btn{flex:1;padding:8px 14px;font-size:12px;font-weight:600;background:transparent;color:var(--text2);border:none;border-radius:20px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;transition:background .15s,color .15s}
.vt-btn.active{background:var(--wr);color:#fff;box-shadow:0 2px 6px rgba(200,16,46,0.3)}
.vt-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.06)}
.vt-btn i{font-size:14px}
.grp-hdr{display:flex;align-items:center;gap:10px;margin:1.5rem 0 .6rem;padding:8px 12px;background:linear-gradient(90deg,var(--wbl) 0%,rgba(255,255,255,0.04) 100%);border-left:4px solid var(--wb-tx);border-radius:0 var(--radius-sm) var(--radius-sm) 0;flex-wrap:wrap}
.grp-hdr-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--wb-tx);flex-shrink:0}
.grp-hdr-teams{font-size:11px;color:var(--text2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp-hdr-team{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.grp-hdr-team::after{content:'·';margin-left:6px;color:var(--text3)}
.grp-hdr-team:last-child::after{content:''}
.ast-block{margin:.4rem 0 1.6rem;padding:10px 14px;border:1px dashed var(--border2);border-radius:var(--radius-sm);background:rgba(255,255,255,0.025);font-size:12px}
.ast-block.on{border-style:solid;border-color:rgba(0,132,61,0.45);background:rgba(0,132,61,0.10)}
.ast-block-hdr{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--wg-tx);margin-bottom:2px;font-size:12px}
.ast-block.on .ast-block-hdr{color:var(--wgr-tx)}
.ast-block-help{font-size:11px;color:var(--text3);margin-bottom:4px}
.ast-block-status{font-size:12px;color:var(--text2)}
.ast-block.on .ast-block-status{color:var(--wgr-tx);font-weight:600}
.save-status{position:fixed;bottom:16px;right:16px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--text2);box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;display:flex;align-items:center;gap:6px}
.save-status.saving{color:var(--wb-tx);border-color:var(--wb-tx)}
.save-status.ok{color:var(--success-text);border-color:var(--success-text);background:var(--success-bg)}
.save-status.err{color:var(--wr);border-color:var(--wr);background:var(--wrl)}
.save-status.saving::before{content:'';width:10px;height:10px;border:2px solid var(--wb-tx);border-top-color:transparent;border-radius:50%;animation:spn .8s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.sync-badge{position:fixed;bottom:16px;left:16px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11px;color:var(--text2);box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:9998;display:flex;align-items:center;gap:5px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:200px;line-height:1.3}
.sync-badge:hover{opacity:.85}
.sync-badge i{font-size:13px;flex-shrink:0}
.sync-badge.syncing{color:var(--wb-tx);border-color:rgba(0,61,165,0.35)}
.sync-badge.syncing i{animation:spn 1s linear infinite}
.sync-badge.ok{color:var(--wgr-tx);border-color:rgba(0,132,61,0.35)}
.sync-badge.err{color:var(--wr-tx);border-color:rgba(200,16,46,0.4);background:var(--wrl)}
.sync-badge.idle{opacity:.7}
.api-status{padding:.8rem;background:rgba(255,255,255,0.04);border-radius:var(--radius-sm);font-size:12px;line-height:1.7;margin-top:1rem}
.api-status strong{color:var(--text)}
img.twe{height:1em;width:auto;vertical-align:-0.125em;display:inline-block;margin:0 1px}
.team-flag img.twe{height:1.05em}
</style>
</head>
<body>
<div class="wrap">
<div id="sc-login" class="screen active"></div>
<div id="sc-main" class="screen"></div>
<div id="sc-admin" class="screen"></div>
<div id="sc-adminpin" class="screen"></div>
<div id="sc-grupos" class="screen"></div>
</div>

function setStatus(t,k){const el=document.getElementById('save-status');if(!el)return;el.innerHTML=t?`<span>${t}</span>`:'';el.className='save-status'+(k?' '+k:'');el.style.opacity=t?'1':'0';}

async function load(){
  if(!sb)return;
  try{
    const{data,error}=await sb.from('prode_state').select('value').eq('key',STATE_KEY).maybeSingle();
    if(error)throw error;
    if(data&&data.value)S=Object.assign(S,data.value);
  }catch(e){console.error('load error',e);setStatus('Error al cargar','err');}
}

async function pushSave(){
  if(!sb)return;
  if(saving){savePending=true;return;}
  saving=true;setStatus('Guardando…','saving');
  try{
    const{error}=await sb.from('prode_state').upsert({key:STATE_KEY,value:S},{onConflict:'key'});
    if(error)throw error;
    lastLocalSaveAt=Date.now();
    setStatus('Guardado','ok');
    setTimeout(()=>{if(!saving)setStatus('','');},1200);
  }catch(e){console.error('save error',e);setStatus('Error al guardar','err');}
  saving=false;
  if(savePending){savePending=false;pushSave();}
}
function save(){pushSave();}

function rerenderCurrent(){
  const lg=document.getElementById('sc-login'),mn=document.getElementById('sc-main'),ad=document.getElementById('sc-admin'),gr=document.getElementById('sc-grupos');
  if(gr.classList.contains('active')){showGruposPublic();return;}
  if(lg.classList.contains('active')&&!me){showLogin();return;}
  if(mn.classList.contains('active')&&me){
    const a=document.querySelector('#sc-main .nb.active');let pane='predicciones';
    if(a){const t=a.textContent;if(t.includes('Ranking'))pane='ranking';else if(t.includes('Grupos'))pane='grupos';else if(t.includes('Bonus'))pane='bonus';}
    renderMain(pane);return;
  }
  if(ad.classList.contains('active')){
    const a=document.querySelector('#sc-admin .nb.active');let pane='jugadores';
    if(a){const t=a.textContent;if(t.includes('Resultados'))pane='resultados';else if(t.includes('Grupos'))pane='grupos';else if(t.includes('Bonus'))pane='bonus';else if(t.includes('API'))pane='api';}
    renderAdmin(pane);
  }
}

function subscribeRealtime(){
  if(!sb)return;
  sb.channel('prode-state').on('postgres_changes',{event:'*',schema:'public',table:'prode_state',filter:`key=eq.${STATE_KEY}`},payload=>{
    if(Date.now()-lastLocalSaveAt<1500)return;
    const v=payload.new&&payload.new.value;if(!v)return;
    S=Object.assign({players:[],predictions:{},results:{},asterisks:{},bonus:{},bonusResults:{}},v);
    rerenderCurrent();
  }).subscribe();
}

  }
  if(typeof supabase==='undefined'){setStatus('Sin conexión a Supabase','err');showLogin();return;}

}

function getFlag(n){return FLAGS[n]||'';}
function tF(n){const f=getFlag(n);return f?`<span class="team-flag">${f}</span> ${n}`:n;}
function parseDt(dt){const[d,m]=dt.split('/').map(Number);return new Date(2026,m-1,d);}
function fmtDateEs(d){const s=d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1);}
function groupByDate(matches){const m=new Map();matches.forEach(x=>{if(!m.has(x.dt))m.set(x.dt,[]);m.get(x.dt).push(x);});return[...m.entries()].sort((a,b)=>parseDt(a[0])-parseDt(b[0]));}

function calcStandings(group){
  const teams=new Set();MG.filter(m=>m.gr===group).forEach(m=>{teams.add(m.h);teams.add(m.a);});
  const tbl={};[...teams].forEach(t=>{tbl[t]={t,pj:0,g:0,e:0,p:0,gf:0,gc:0,dg:0,pts:0};});
  MG.filter(m=>m.gr===group).forEach(m=>{
    const r=S.results[m.id];if(!r||r.h===undefined||r.a===undefined)return;
    const h=tbl[m.h],a=tbl[m.a];const rh=parseInt(r.h),ra=parseInt(r.a);
    if(isNaN(rh)||isNaN(ra))return;
    h.pj++;a.pj++;h.gf+=rh;h.gc+=ra;a.gf+=ra;a.gc+=rh;
    if(rh>ra){h.g++;a.p++;h.pts+=3;}
    else if(rh<ra){a.g++;h.p++;a.pts+=3;}
    else{h.e++;a.e++;h.pts++;a.pts++;}
  });
  Object.values(tbl).forEach(x=>x.dg=x.gf-x.gc);
  return Object.values(tbl).sort((x,y)=>y.pts-x.pts||y.dg-x.dg||y.gf-x.gf||x.t.localeCompare(y.t));
}

function shortName(name){
  if(!name)return name;
  if(CODES[name])return CODES[name];
  let m;
  m=name.match(/^([12])° Grupo ([A-L])$/);if(m)return m[1]+'°'+m[2];
  m=name.match(/^3°\s+([A-Z\/]+)$/);if(m)return '3°…';
  m=name.match(/^G\. P(\d+)$/);if(m)return 'P'+m[1];
  m=name.match(/^Gan\. SF([12])$/);if(m)return 'G.SF'+m[1];
  m=name.match(/^Perd\. SF([12])$/);if(m)return 'P.SF'+m[1];
  return name.length>4?name.slice(0,3).toUpperCase()+'.':name;
}
function resolveMatchWinner(m){
  const r=S.results[m.id];if(!r||r.h===undefined||r.a===undefined)return null;
  const h=parseInt(r.h),a=parseInt(r.a);if(isNaN(h)||isNaN(a))return null;
  if(h>a)return m.h;if(a>h)return m.a;
  if(r.adv===m.h)return m.h;if(r.adv===m.a)return m.a;return null;
}
function resolveMatchLoser(m){const w=resolveMatchWinner(m);if(!w)return null;return w===m.h?m.a:m.h;}

  const key=JSON.stringify(S.results||{});

  const thirds=[];
  groups.forEach(g=>{const st=calcStandings(g);if(st[2]&&st[2].pj>0)thirds.push({...st[2],group:g});});
  thirds.sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||a.t.localeCompare(b.t));
  const top8=thirds.slice(0,8);
  const slots=ME.filter(m=>/^3°/.test(m.a||'')||/^3°/.test(m.h||'')).map(m=>{
    const lbl=/^3°/.test(m.h)?m.h:m.a;
    const mm=lbl.match(/^3°\s+([A-Z\/]+)$/);
    return{id:m.id,pool:mm?mm[1].split('/'):[]};
  });
  const assignment={};const usedTeams=new Set();const usedGroups=new Set();
  slots.forEach(s=>{
    const cand=top8.find(t=>!usedTeams.has(t.t)&&!usedGroups.has(t.group)&&s.pool.includes(t.group));
    if(cand){assignment[s.id]=cand.t;usedTeams.add(cand.t);usedGroups.add(cand.group);}
  });
  _thirdsCache=assignment;_thirdsCacheKey=key;return assignment;
}
function resolveSlot(label,matchId){
  if(!label)return label;let mm;
  mm=label.match(/^([12])° Grupo ([A-L])$/);
  if(mm){const st=calcStandings(mm[2]);const idx=parseInt(mm[1])-1;return st[idx]?st[idx].t:label;}
  mm=label.match(/^G\. P(\d+)$/);
  if(mm){const e=ME.find(x=>x.id==='e'+(parseInt(mm[1])-72));if(!e)return label;const w=resolveMatchWinner(e);return w?resolveSlot(w,e.id):label;}
  mm=label.match(/^Gan\. SF([12])$/);
  if(mm){const e=ME.find(x=>x.id==='e'+(28+parseInt(mm[1])));if(!e)return label;const w=resolveMatchWinner(e);return w?resolveSlot(w,e.id):label;}
  mm=label.match(/^Perd\. SF([12])$/);
  if(mm){const e=ME.find(x=>x.id==='e'+(28+parseInt(mm[1])));if(!e)return label;const l=resolveMatchLoser(e);return l?resolveSlot(l,e.id):label;}
  if(/^3°/.test(label)&&matchId){const a=thirdAssignments();if(a[matchId])return a[matchId];}
  return label;
}
const BRACKET={

function renderBracketSide(side,phaseKey){

function ini(n){return n.trim().split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function gpts(p,r){
  if(!p||!r)return 0;
  const ph=parseInt(p.h),pa=parseInt(p.a),rh=parseInt(r.h),ra=parseInt(r.a);
  if([ph,pa,rh,ra].some(isNaN))return 0;
  const pw=ph>pa?'h':ph<pa?'a':'d',rw=rh>ra?'h':rh<ra?'a':'d';
  if(pw===rw){if(ph===rh&&pa===ra)return 9;if(rw==='d')return 5;if(ph===rh||pa===ra)return 6;return 4;}
  return(ph===rh||pa===ra)?1:0;
}
function epts(p,r){
  if(!p||!r)return 0;
  const ph=parseInt(p.h),pa=parseInt(p.a),rh=parseInt(r.h),ra=parseInt(r.a);
  if([ph,pa,rh,ra].some(isNaN))return 0;
  const pw=ph>pa?'h':ph<pa?'a':'d',rw=rh>ra?'h':rh<ra?'a':'d';
  const adv=p.adv&&r.adv&&p.adv===r.adv;
  if(pw===rw){if(rw!=='d'){if(ph===rh&&pa===ra)return 9;if(ph===rh||pa===ra)return 6;return 4;}if(ph===rh&&pa===ra&&adv)return 10;return 5;}
  if(adv)return(ph===rh||pa===ra)?2:1;
  return(ph===rh||pa===ra)?1:0;
}
function isPleno(id,p,r){
  if(!p||!r)return false;
  const m=AM.find(x=>x.id===id);if(!m)return false;
  const ph=parseInt(p.h),pa=parseInt(p.a),rh=parseInt(r.h),ra=parseInt(r.a);
  if([ph,pa,rh,ra].some(isNaN))return false;
  const pw=ph>pa?'h':ph<pa?'a':'d',rw=rh>ra?'h':rh<ra?'a':'d';
  if(m.ph==='group')return pw===rw&&ph===rh&&pa===ra;
  return pw===rw&&ph===rh&&pa===ra&&(rw!=='d'||!!(p.adv&&r.adv&&p.adv===r.adv));
}
function calcAll(name){
  let tot=0,pl=0;
  const pr=S.predictions[name]||{},as=S.asterisks[name]||{};
  AM.forEach(m=>{
    const pd=pr[m.id],rs=S.results[m.id];if(!pd||!rs)return;
    let pts=m.ph==='group'?gpts(pd,rs):epts(pd,rs);
    if(as[m.id])pts*=2;tot+=pts;
    if(isPleno(m.id,pd,rs))pl++;
  });
  const br=S.bonusResults||{},bp=S.bonus[name]||{};
  if(br.ch&&bp.ch&&br.ch.toLowerCase()===bp.ch.toLowerCase())tot+=10;
  if(br.sc&&bp.sc&&br.sc.toLowerCase()===bp.sc.toLowerCase())tot+=10;
  if(br.lp&&bp.lp&&br.lp.toLowerCase()===bp.lp.toLowerCase())tot+=10;
  return{tot,pl};
}
function maxPlenos(){if(!S.players.length)return 0;return Math.max(...S.players.map(p=>calcAll(p.name).pl));}

function mCard(m,pr,as,type,ctx){
  const p=pr[m.id]||{},r=S.results[m.id],isAst=!!as[m.id],locked=!!r;
  let pts=null;if(r){pts=type==='group'?gpts(p,r):epts(p,r);if(isAst)pts*=2;}
  const ipl=r&&isPleno(m.id,p,r);
  return`<div class="match-row${locked?' locked':''}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:4px">
      <span class="mteams">${tF(m.h)}<span class="vs">vs</span>${tF(m.a)} <span style="font-size:11px;color:var(--text3)">${m.dt}</span></span>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        ${pts!==null?`<span class="badge ${pts>0?'bgreen':'bgray'}">${pts}pts${isAst?' ★':''}</span>`:''}
        ${ipl?'<span class="badge bg">PLENO ★</span>':''}
        ${locked?'<span class="badge br"><i class="ti ti-lock" style="font-size:10px"></i> cerrado</span>':''}
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <input class="si" type="number" min="0" max="20" placeholder="?" value="${p.h!==undefined?p.h:''}" ${locked?'disabled':''} onchange="setPred('${m.id}','h',this.value)">
      <span style="font-size:18px;font-weight:600;color:var(--text3)">–</span>
      <input class="si" type="number" min="0" max="20" placeholder="?" value="${p.a!==undefined?p.a:''}" ${locked?'disabled':''} onchange="setPred('${m.id}','a',this.value)">
      ${type==='elim'?`<select class="adv-sel" ${locked?'disabled':''} onchange="setPred('${m.id}','adv',this.value)"><option value="">¿Clasifica?</option><option value="${m.h}" ${p.adv===m.h?'selected':''}>${getFlag(m.h)} ${m.h}</option><option value="${m.a}" ${p.adv===m.a?'selected':''}>${getFlag(m.a)} ${m.a}</option></select>`:''}
      <button class="ab ${isAst?'on':''}" title="Asterisco (puntaje doble)" ${locked?'disabled':''} onclick="toggleAst('${m.id}','${type}','${ctx}')">★</button>
    </div>
    ${officialResultLine(m,r,type)}
  </div>`;
}

function setPred(id,f,v){
  if(!S.predictions[me])S.predictions[me]={};
  if(!S.predictions[me][id])S.predictions[me][id]={};
  S.predictions[me][id][f]=(f==='h'||f==='a')?(v===''?undefined:parseInt(v)):v;
  save();
}
function toggleAst(id,type,ctx){
  if(!S.asterisks[me])S.asterisks[me]={};
  const cur=!!S.asterisks[me][id];
  const ctxIds=type==='group'?MG.filter(m=>m.gr===ctx).map(m=>m.id):ME.filter(m=>m.ph===ctx).map(m=>m.id);
  if(!cur&&ctxIds.filter(x=>S.asterisks[me][x]&&x!==id).length>=1){alert('Solo 1 asterisco por grupo/fase.');return;}
  S.asterisks[me][id]=!cur;save();renderPred();
}

// Devuelve el equipo clasificado (etiqueta resuelta) y cómo se resolvió, para mostrar en tarjetas.
function elimResName(m,r){const lbl=r.adv===m.h?m.h:r.adv===m.a?m.a:null;return lbl?resolveSlot(lbl,m.id):null;}
// Línea "Resultado oficial" para la vista de jugador (incluye resolución de eliminatorias).
function officialResultLine(m,r,type){
  if(!r||r.h===undefined||r.a===undefined)return'';
  let extra='';
  if(type==='elim'){
    const hi=parseInt(r.h),ai=parseInt(r.a),advName=elimResName(m,r);
    const clf=advName?(getFlag(advName)?getFlag(advName)+' ':'')+advName:'';
    if(hi===ai){
      if(r.resolution==='extra_time')extra=` · ⏱️ Tiempo extra${clf?' → Clasifica: '+clf:''}`;
      else if(r.resolution==='penalties')extra=` · 🥅 Penales${clf?' → Clasifica: '+clf:''}`;
      else if(clf)extra=` · Clasifica: ${clf}`;
    } else extra=' · 90 min';
  }
  return`<div style="margin-top:5px;font-size:11px;color:var(--text3)">Resultado oficial: <strong>${r.h}–${r.a}</strong>${extra}</div>`;
}
function elimBadge(m,r){
  const done=r&&r.h!==undefined&&r.a!==undefined;
  if(!done)return'<span class="badge bgray">pendiente</span>';
  const hi=parseInt(r.h),ai=parseInt(r.a),tie=hi===ai;
  const advName=elimResName(m,r);
  let txt=`${r.h}–${r.a}`;
  if(!tie){txt+=` <span class="res-tag">90 min</span>`;}
  else if(r.resolution==='extra_time'){txt+=` <span class="res-tag">⏱️ T. EXTRA</span>`+(advName?' · '+(getFlag(advName)?getFlag(advName)+' ':'')+advName:'');}
  else if(r.resolution==='penalties'){txt+=` <span class="res-tag">🥅 PENALES</span>`+(advName?' · '+(getFlag(advName)?getFlag(advName)+' ':'')+advName:'');}
  else{return`<span class="badge bgray" style="background:rgba(233,196,106,.22);color:#E9C46A">${r.h}–${r.a} · falta definir</span>`;}
  return`<span class="badge bgreen">${txt}</span>`;
}
function rCard(m,elim){
  const r=S.results[m.id]||{};const done=r.h!==undefined&&r.a!==undefined;
  if(!elim){
    return`<div class="match-row" style="${done?'border-color:#4caf50':''}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:4px">
        <span class="mteams">${tF(m.h)}<span class="vs">vs</span>${tF(m.a)} <span style="font-size:11px;color:var(--text3)">${m.dt}</span></span>

        <span style="font-size:18px;font-weight:600;color:var(--text3)">–</span>
        <input class="si" type="number" min="0" max="20" placeholder="?" value="${r.a!==undefined?r.a:''}" onchange="setRes('${m.id}','a',this.value)">
      </div>
    </div>`;
  }
  // Formulario eliminatorio en 3 pasos (sólo se registra el resultado de los 90 minutos)
  const hRes=resolveSlot(m.h,m.id),aRes=resolveSlot(m.a,m.id);
  const hLbl=(getFlag(hRes)?getFlag(hRes)+' ':'')+hRes,aLbl=(getFlag(aRes)?getFlag(aRes)+' ':'')+aRes;
  return`<div class="match-row" id="el-card-${m.id}" style="${done?'border-color:#4caf50':''}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:4px">
      <span class="mteams">${tF(hRes)}<span class="vs">vs</span>${tF(aRes)} <span style="font-size:11px;color:var(--text3)">${m.dt}</span></span>
      <span id="el-badge-${m.id}">${elimBadge(m,r)}</span>
    </div>
    <div class="elim-step">
      <div class="elim-step-lbl">Paso 1 · Marcador a los 90 minutos</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <input id="el-h-${m.id}" class="si" type="number" min="0" max="20" placeholder="?" value="${r.h!==undefined?r.h:''}" oninput="updateElimUI('${m.id}')" onchange="setRes('${m.id}','h',this.value)">
        <span style="font-size:18px;font-weight:600;color:var(--text3)">–</span>
        <input id="el-a-${m.id}" class="si" type="number" min="0" max="20" placeholder="?" value="${r.a!==undefined?r.a:''}" oninput="updateElimUI('${m.id}')" onchange="setRes('${m.id}','a',this.value)">
      </div>
      <div id="el-fb-${m.id}" class="elim-fb"></div>
    </div>
    <div id="el-p2-${m.id}" class="elim-step" style="display:none">
      <div class="elim-step-lbl">Paso 2 · ¿Cómo se resolvió?</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <label class="elim-radio"><input type="radio" name="res-${m.id}" value="extra_time" ${r.resolution==='extra_time'?'checked':''} onchange="setRes('${m.id}','resolution',this.value)"> ⏱️ Tiempo extra</label>
        <label class="elim-radio"><input type="radio" name="res-${m.id}" value="penalties" ${r.resolution==='penalties'?'checked':''} onchange="setRes('${m.id}','resolution',this.value)"> 🥅 Penales</label>
      </div>
    </div>
    <div id="el-p3-${m.id}" class="elim-step" style="display:none">
      <div class="elim-step-lbl">Paso 3 · ¿Quién clasificó?</div>
      <select class="adv-sel" onchange="setRes('${m.id}','adv',this.value)"><option value="">Elegí el equipo…</option><option value="${m.h}" ${r.adv===m.h?'selected':''}>${hLbl}</option><option value="${m.a}" ${r.adv===m.a?'selected':''}>${aLbl}</option></select>
    </div>
  </div>`;
}
// Validación de un resultado eliminatorio. No muta nada; sólo informa.
function validateElimResult(matchId,res){
  const m=ME.find(x=>x.id===matchId);if(!m)return{ok:false,msg:'Partido no encontrado.'};
  res=res||{};
  const h=res.h,a=res.a;
  if(h===undefined||a===undefined||h===''||a===''||isNaN(parseInt(h))||isNaN(parseInt(a)))
    return{ok:false,msg:'Completá el marcador de los 90 minutos.'};
  const hi=parseInt(h),ai=parseInt(a);
  if(hi!==ai)return{ok:true,msg:'OK'};
  // Empate en 90 min → requiere resolución y clasificado
  if(res.resolution!=='extra_time'&&res.resolution!=='penalties')
    return{ok:false,msg:'Empate en 90 min: indicá si se definió en tiempo extra o penales.'};
  if(res.adv!==m.h&&res.adv!==m.a)
    return{ok:false,msg:'Empate en 90 min: indicá quién clasificó.'};
  return{ok:true,msg:'OK'};
}
function setRes(id,f,v){
  if(!S.results[id])S.results[id]={};
  const r=S.results[id];
  r[f]=(f==='h'||f==='a')?(v===''?undefined:parseInt(v)):(v===''?undefined:v);
  // Normalización para partidos eliminatorios: el ganador en 90' clasifica automáticamente.
  const em=ME.find(x=>x.id===id);
  if(em){
    const hh=r.h,aa=r.a;
    if(hh!==undefined&&aa!==undefined&&!isNaN(hh)&&!isNaN(aa)){
      if(hh!==aa){r.adv=hh>aa?em.h:em.a;r.resolution='regular';}
      else if(r.resolution==='regular'){r.resolution=undefined;r.adv=undefined;}
    } else if(hh===undefined||aa===undefined){
      if(r.resolution==='regular'){r.resolution=undefined;r.adv=undefined;}
    }
  }
  save();
  if(em){const b=document.getElementById('el-badge-'+id);if(b)b.innerHTML=elimBadge(em,r);updateElimUI(id);}
}
// Actualiza en vivo la visibilidad de los pasos 2/3 y el mensaje de ayuda mientras el admin escribe.
function updateElimUI(id){
  const hEl=document.getElementById('el-h-'+id),aEl=document.getElementById('el-a-'+id);
  if(!hEl||!aEl)return;
  const m=ME.find(x=>x.id===id);if(!m)return;
  const p2=document.getElementById('el-p2-'+id),p3=document.getElementById('el-p3-'+id),fb=document.getElementById('el-fb-'+id);
  const hRes=resolveSlot(m.h,m.id),aRes=resolveSlot(m.a,m.id);
  const hv=hEl.value,av=aEl.value;
  const has=hv!==''&&av!==''&&!isNaN(parseInt(hv))&&!isNaN(parseInt(av));
  const show=el=>{if(el)el.style.display='';},hide=el=>{if(el)el.style.display='none';};
  if(!has){hide(p2);hide(p3);if(fb){fb.textContent='Completá el marcador de los 90 minutos.';fb.className='elim-fb';}return;}
  const hi=parseInt(hv),ai=parseInt(av);
  if(hi>ai){hide(p2);hide(p3);if(fb){fb.textContent='Gana '+hRes+' en los 90 min — clasifica automáticamente.';fb.className='elim-fb ok';}}
  else if(ai>hi){hide(p2);hide(p3);if(fb){fb.textContent='Gana '+aRes+' en los 90 min — clasifica automáticamente.';fb.className='elim-fb ok';}}
  else{
    show(p2);show(p3);const r=S.results[id]||{};
    const radios=document.getElementsByName('res-'+id);if(radios)Array.prototype.forEach.call(radios,rd=>{rd.checked=(rd.value===r.resolution);});
    if(p3){const sel=p3.querySelector('select');if(sel)sel.value=r.adv||'';}
    const v=validateElimResult(id,r);if(fb){fb.textContent=v.ok?'Empate en 90 min — definición registrada.':'Empate en 90 min — indicá cómo se resolvió y quién clasificó.';fb.className='elim-fb '+(v.ok?'ok':'warn');}
  }
}
// Inicializa el estado visual de todas las tarjetas eliminatorias tras renderizar.
function initElimCards(){ME.forEach(m=>{if(document.getElementById('el-card-'+m.id))updateElimUI(m.id);});}
function setBR(f,v){S.bonusResults[f]=v;save();}
function addPlayer(){
  const nEl=document.getElementById('newName'),pEl=document.getElementById('newPin'),errEl=document.getElementById('add-err');
  const name=nEl?nEl.value.trim():'',pin=pEl?pEl.value.trim():'';
  if(!name){if(errEl)errEl.textContent='Ingresá el nombre.';return;}
  if(!/^\d{4}$/.test(pin)){if(errEl)errEl.textContent='El PIN debe ser exactamente 4 dígitos numéricos.';return;}
  if(S.players.find(p=>p.name===name)){if(errEl)errEl.textContent='Ya existe ese nombre.';return;}
  if(S.players.find(p=>p.pin===pin)){if(errEl)errEl.textContent='Ese PIN ya está en uso.';return;}
  S.players.push({name,pin});save();renderAdmin('jugadores');
}
function removePlayer(i){
  if(!confirm(`¿Eliminar a ${S.players[i].name}? Se borrarán todas sus predicciones.`))return;
  const n=S.players[i].name;S.players.splice(i,1);delete S.predictions[n];delete S.asterisks[n];delete S.bonus[n];save();renderAdmin('jugadores');
}

// ====== Football-data.org auto-sync ======
const FOOTBALL_API_KEY_DEFAULT='b87c5c836d8f4d94bb90b226daa54c14';
const FOOTBALL_API_URL='https://api.football-data.org/v4/competitions/WC/matches';
const CORS_PROXY='https://corsproxy.io/?';
const UPDATE_INTERVAL_MINUTES=5;
const TEAM_NAME_MAP={'Mexico':'México','South Africa':'Sudáfrica','South Korea':'Corea del Sur','Korea Republic':'Corea del Sur','Czech Republic':'República Checa','Czechia':'República Checa','Canada':'Canadá','Bosnia and Herzegovina':'Bosnia y Herzegovina','Australia':'Australia','Turkey':'Turquía','Türkiye':'Turquía','Germany':'Alemania','Curaçao':'Curazao','Curacao':'Curazao',"Côte d'Ivoire":'Costa de Marfil','Ivory Coast':'Costa de Marfil','Ecuador':'Ecuador','Netherlands':'Países Bajos','Japan':'Japón','Sweden':'Suecia','Tunisia':'Túnez','Belgium':'Bélgica','Egypt':'Egipto','Iran':'Irán','IR Iran':'Irán','New Zealand':'Nueva Zelanda','Spain':'España','Cabo Verde':'Cabo Verde','Cape Verde':'Cabo Verde','Saudi Arabia':'Arabia Saudita','Uruguay':'Uruguay','France':'Francia','Senegal':'Senegal','Iraq':'Irak','Norway':'Noruega','Argentina':'Argentina','Algeria':'Argelia','Austria':'Austria','Jordan':'Jordania','Portugal':'Portugal','DR Congo':'RD de Congo','Congo DR':'RD de Congo','Uzbekistan':'Uzbekistán','Colombia':'Colombia','England':'Inglaterra','Croatia':'Croacia','Ghana':'Ghana','Panama':'Panamá','Brazil':'Brasil','Morocco':'Marruecos','Haiti':'Haití','Scotland':'Escocia','United States':'Estados Unidos','USA':'Estados Unidos','Paraguay':'Paraguay','Qatar':'Qatar','Switzerland':'Suiza'};
const STAGE_MAP={'GROUP_STAGE':'group','LAST_32':'r32','ROUND_OF_32':'r32','LAST_16':'qf','ROUND_OF_16':'qf','QUARTER_FINALS':'sf','SEMI_FINALS':'semif','THIRD_PLACE':'tp','3RD_PLACE':'tp','FINAL':'final'};
let _syncState={status:'idle',lastSync:null,error:null,count:0};
let _syncTimer=null;
function getApiKey(){return(S.apiKey&&S.apiKey.length>10)?S.apiKey:FOOTBALL_API_KEY_DEFAULT;}
function isAutoSyncEnabled(){return S.autoSync!==false;}
function trTeam(n){return TEAM_NAME_MAP[n]||n;}
function apiDateToDt(iso){const d=new Date(iso);const dd=String(d.getUTCDate()).padStart(2,'0');const mm=String(d.getUTCMonth()+1).padStart(2,'0');return dd+'/'+mm;}
function renderSyncBadge(){
  const el=document.getElementById('sync-badge');if(!el)return;
  const s=_syncState;let cls='idle',icon='ti-cloud',txt='Sin sync';
  if(s.status==='syncing'){cls='syncing';icon='ti-loader-2';txt='Sincronizando…';}
  else if(s.status==='ok'){
    cls='ok';icon='ti-cloud-check';
    const mins=s.lastSync?Math.floor((Date.now()-s.lastSync)/60000):0;
    txt=mins<1?'Sincronizado':`Sync hace ${mins}m`;
  }
  else if(s.status==='error'){cls='err';icon='ti-cloud-off';txt='Sin conexión';}
  el.className='sync-badge '+cls;
  el.innerHTML=`<i class="ti ${icon}"></i> <span>${txt}</span>`;
  el.title=s.error?('Error: '+s.error):'Click para sincronizar ahora';
}
async function fetchApiMatches(){
  const key=getApiKey();if(!key)throw new Error('Sin API key');
  const direct=async()=>{const r=await fetch(FOOTBALL_API_URL,{headers:{'X-Auth-Token':key}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();};
  const proxied=async()=>{const r=await fetch(CORS_PROXY+encodeURIComponent(FOOTBALL_API_URL),{headers:{'X-Auth-Token':key}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();};
  try{return await direct();}catch(e){return await proxied();}
}
async function syncResultsFromAPI(){
  _syncState.status='syncing';renderSyncBadge();
  try{
    const data=await fetchApiMatches();
    const matches=(data.matches||[]).filter(m=>m.status==='FINISHED').sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate));
    let changes=0;
    matches.forEach(m=>{
      const ft=m.score&&m.score.fullTime;if(!ft||ft.home==null||ft.away==null)return;
      const homeES=trTeam(m.homeTeam&&m.homeTeam.name);
      const awayES=trTeam(m.awayTeam&&m.awayTeam.name);
      const sh=parseInt(ft.home),sa=parseInt(ft.away);
      if(isNaN(sh)||isNaN(sa))return;
      // 1) Grupo: matchear por nombres directamente en MG
      const mg=MG.find(x=>x.h===homeES&&x.a===awayES);
      if(mg){
        const cur=S.results[mg.id]||{};
        if(cur.h!==sh||cur.a!==sa){S.results[mg.id]={...cur,h:sh,a:sa};changes++;}
        return;
      }
      // 2) Eliminatorias: por stage + fecha
      const phKey=STAGE_MAP[m.stage];if(!phKey||phKey==='group')return;
      const apiDt=apiDateToDt(m.utcDate);
      const cand=ME.filter(x=>x.ph===phKey&&x.dt===apiDt);
      if(!cand.length)return;
      // Si hay varios candidatos en el día, elegir el que su m.h resuelve al home de API o cuyo m.a resuelva al away
      let me=cand.find(x=>{const rh=resolveSlot(x.h,x.id),ra=resolveSlot(x.a,x.id);return(rh===homeES&&ra===awayES)||(rh===awayES&&ra===homeES);});
      if(!me)me=cand[0];
      const hResolved=resolveSlot(me.h,me.id),aResolved=resolveSlot(me.a,me.id);
      let sideH=sh,sideA=sa,advLabel=null;
      // Si la API home corresponde a m.a, invertimos
      if(hResolved===awayES&&aResolved===homeES){sideH=sa;sideA=sh;}
      // Determinar ganador → label de m.h o m.a
      let winnerTeamES=null;
      if(sh>sa)winnerTeamES=homeES;
      else if(sa>sh)winnerTeamES=awayES;
      else if(m.score.winner==='HOME_TEAM')winnerTeamES=homeES;
      else if(m.score.winner==='AWAY_TEAM')winnerTeamES=awayES;
      if(winnerTeamES){
        if(hResolved===winnerTeamES)advLabel=me.h;
        else if(aResolved===winnerTeamES)advLabel=me.a;
      }
      const cur=S.results[me.id]||{};
      const upd={h:sideH,a:sideA};if(advLabel)upd.adv=advLabel;
      if(cur.h!==upd.h||cur.a!==upd.a||(advLabel&&cur.adv!==advLabel)){S.results[me.id]={...cur,...upd};changes++;}
    });
    _syncState={status:'ok',lastSync:Date.now(),error:null,count:changes};
    if(changes>0){save();rerenderCurrent();}
  }catch(e){
    console.warn('syncResultsFromAPI',e);
    _syncState={status:'error',lastSync:_syncState.lastSync,error:e.message||'Error desconocido',count:0};
  }
  renderSyncBadge();
}
function manualSync(){syncResultsFromAPI();}
function startAutoSync(){
  if(_syncTimer){clearInterval(_syncTimer);_syncTimer=null;}
  if(!isAutoSyncEnabled())return;
  syncResultsFromAPI();
  _syncTimer=setInterval(syncResultsFromAPI,UPDATE_INTERVAL_MINUTES*60*1000);
}
function stopAutoSync(){if(_syncTimer){clearInterval(_syncTimer);_syncTimer=null;}_syncState.status='idle';renderSyncBadge();}
function saveApiKey(){
  const inp=document.getElementById('api-key-input');if(!inp)return;
  const v=inp.value.trim();S.apiKey=v;save();renderAdmin('api');startAutoSync();
}
function toggleAutoSync(){
  const tog=document.getElementById('auto-sync-tog');if(!tog)return;
  S.autoSync=tog.checked;save();
  if(tog.checked)startAutoSync();else stopAutoSync();
  renderAdmin('api');
}
// Refresca el "hace X min" del badge cada 60s
setInterval(renderSyncBadge,60000);

// ====== Integrity check del fixture (corre 1 vez al cargar) ======
(function validateFixtureIntegrity(){
  const issues=[];
  // IDs únicos en MG
  const mgIds=MG.map(m=>m.id);
  const mgDup=[...new Set(mgIds.filter((id,i)=>mgIds.indexOf(id)!==i))];
  if(mgDup.length)issues.push(`MG: IDs duplicados: ${mgDup.join(', ')}`);
  // IDs únicos en ME
  const meIds=ME.map(m=>m.id);
  const meDup=[...new Set(meIds.filter((id,i)=>meIds.indexOf(id)!==i))];
  if(meDup.length)issues.push(`ME: IDs duplicados: ${meDup.join(', ')}`);
  // Conteo correcto
  if(MG.length!==72)issues.push(`MG: hay ${MG.length} partidos, deberían ser 72`);
  if(ME.length!==32)issues.push(`ME: hay ${ME.length} partidos, deberían ser 32`);
  // Cada grupo: 6 partidos, 4 equipos
  const groups=[...new Set(MG.map(m=>m.gr))];
  if(groups.length!==12)issues.push(`Grupos: hay ${groups.length}, deberían ser 12 (A-L)`);
  groups.forEach(g=>{
    const ms=MG.filter(m=>m.gr===g);
    if(ms.length!==6)issues.push(`Grupo ${g}: tiene ${ms.length} partidos, deberían ser 6`);
    const teams=new Set();ms.forEach(m=>{teams.add(m.h);teams.add(m.a);});
    if(teams.size!==4)issues.push(`Grupo ${g}: tiene ${teams.size} equipos, deberían ser 4 (${[...teams].join(', ')})`);
  });
  // FLAGS y CODES presentes para cada equipo
  const allTeams=new Set();MG.forEach(m=>{allTeams.add(m.h);allTeams.add(m.a);});
  allTeams.forEach(t=>{
    if(!FLAGS[t])issues.push(`FLAGS: falta entrada para "${t}"`);
    if(!CODES[t])issues.push(`CODES: falta entrada para "${t}"`);
  });
  // r32: cada "1°/2° Grupo X" aparece exactamente una vez
  const slotCount={};
  ME.filter(m=>m.ph==='r32').forEach(m=>{[m.h,m.a].forEach(slot=>{if(/^[12]° Grupo [A-L]$/.test(slot))slotCount[slot]=(slotCount[slot]||0)+1;});});
  groups.forEach(g=>{['1','2'].forEach(pos=>{
    const lbl=`${pos}° Grupo ${g}`;const c=slotCount[lbl]||0;
    if(c===0)issues.push(`r32: falta slot "${lbl}"`);
    else if(c>1)issues.push(`r32: slot "${lbl}" aparece ${c} veces (debería ser 1)`);
  });});
  // 8 slots de 3° en r32
  const thirdSlots=ME.filter(m=>m.ph==='r32').reduce((acc,m)=>acc+(/^3°/.test(m.h)?1:0)+(/^3°/.test(m.a)?1:0),0);
  if(thirdSlots!==8)issues.push(`r32: hay ${thirdSlots} slots de mejores 3°, deberían ser 8`);
  // qf/sf/semif/final: referencias "G. P##" / "Gan. SF#" / "Perd. SF#" deben apuntar a matches existentes
  ME.filter(m=>['qf','sf','semif','tp','final'].includes(m.ph)).forEach(m=>{
    [m.h,m.a].forEach(slot=>{
      let mm=slot.match(/^G\. P(\d+)$/);
      if(mm){const t='e'+(parseInt(mm[1])-72);if(!ME.find(x=>x.id===t))issues.push(`${m.id}: referencia "${slot}" → ${t} inexistente`);}
      mm=slot.match(/^(Gan|Perd)\. SF([12])$/);
      if(mm){const t='e'+(28+parseInt(mm[2]));if(!ME.find(x=>x.id===t))issues.push(`${m.id}: referencia "${slot}" → ${t} inexistente`);}
    });
  });
  // Pools de mejores 3° válidos (cada letra del pool es un grupo A-L)
  ME.filter(m=>m.ph==='r32').forEach(m=>{
    [m.h,m.a].forEach(slot=>{
      const mm=slot.match(/^3°\s+([A-Z\/]+)$/);
      if(mm){
        const pool=mm[1].split('/');
        const invalid=pool.filter(p=>!groups.includes(p));
        if(invalid.length)issues.push(`${m.id}: pool "${slot}" contiene grupos inválidos: ${invalid.join(', ')}`);
      }
    });
  });
  // Reporte final
  if(issues.length){
    console.warn(`%c⚠ Fixture integrity: ${issues.length} problema${issues.length===1?'':'s'} detectado${issues.length===1?'':'s'}`,'color:#ff9800;font-weight:bold;font-size:13px');
    issues.forEach(i=>console.warn('  • '+i));
  }else{
    console.log('%c✓ Fixture OK','color:#4caf50;font-weight:bold;font-size:13px',`(${MG.length} partidos de grupos + ${ME.length} de eliminatorias, ${allTeams.size} equipos, todas las referencias válidas)`);
  }
})();

boot();
